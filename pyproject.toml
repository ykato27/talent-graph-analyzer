[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-graph-analyzer"
version = "3.0.0"
description = "Skillnote CSVのローカル力量比較とグラフ分析"
readme = "README.md"
requires-python = ">=3.15.1,<3.16"
dependencies = [
    "numpy>=2.3,<3",
    "pandas>=2.3,<4",
    "scipy>=1.16,<2",
    "scikit-learn>=1.7,<2",
    "statsmodels>=0.15,<1",
]

[project.scripts]
talent-graph = "talent_graph.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-cov>=6,<8", "ruff>=0.14"]

[tool.setuptools]
packages = ["talent_graph", "causal_inference"]
py-modules = ["gnn_talent_analyzer", "app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: slow tests", "integration: integration tests", "unit: unit tests"]

[tool.ruff]
target-version = "py315"
line-length = 100
