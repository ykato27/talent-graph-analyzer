[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-graph-analyzer"
version = "2.0.0"
description = "GNN-based talent analysis system with advanced causal inference"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# 依存関係の正はこの pyproject.toml とする（2026-10-23 に一本化）。
# 以前は requirements.txt / requirements/*.txt / pyproject の3系統で定義が分裂し、
# numpy の上限などが食い違っていた。requirements.txt は uv export の生成物、
# requirements/*.txt は廃止のお知らせに置き換えた。
# 上限は旧 requirements/*.txt の管理値に合わせた。
dependencies = [
    "streamlit>=1.28.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.11.0,<2.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
    "plotly>=5.17.0,<6.0.0",
    "pyyaml>=6.0,<7.0",
    "statsmodels>=0.14.0,<0.15.0",
    "matplotlib>=3.7.0,<4.0.0",
    "seaborn>=0.12.0,<1.0.0",
]

[project.optional-dependencies]
# econml / xgboost はコード内でも遅延 import（未導入時は案内エラー）される
# 任意依存のため、extras として分離する。
# econml 0.14.x は scikit-learn<1.3 を要求し、本体の scikit-learn>=1.3 と
# 両立しない（旧定義の矛盾を uv lock が検出した）。0.15 以降に緩める。
causal = [
    "econml>=0.15.0",
]
ml = [
    "xgboost>=2.0.0,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "pytest-mock>=3.12.0,<4.0.0",
    "pytest-benchmark>=4.0.0,<5.0.0",
    "mypy>=1.7.0",
    "black>=23.12.0",
    "flake8>=7.0.0",
    "isort>=5.13.0",
]

# Streamlit アプリであり配布用パッケージではないため、プロジェクト自体は
# ビルド・インストールしない（keiba-solo-db / property-price-lookup と同方式）。
[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
    "statsmodels.*",
    "econml.*",
    "matplotlib.*",
    "seaborn.*",
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=causal_inference",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
branch = true
source = ["causal_inference"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/conftest.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101", "B601"]  # Skip assert_used and paramiko

[tool.pylint.messages_control]
max-line-length = 120
disable = [
    "C0103",  # Invalid name
    "C0114",  # Missing module docstring (covered by pydocstyle)
    "R0913",  # Too many arguments
    "R0914",  # Too many local variables
]

[tool.pydocstyle]
convention = "numpy"
add-ignore = ["D100", "D104"]  # Missing docstring in public module/package
