  <rect x="304.84" y="24" width="234.60999999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="422.145" y="50.900000000000006" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="422.145" dy="-3.9000000000000012">比較の基準にする社員を指定</tspan><tspan x="422.145" dy="16.900000000000002">例：指導担当の6名</tspan></text>
</g>
<g class="node" data-id="D" data-label="共通する力量
基準群と他の社員で保有率を比較" data-shape="rectangle">
  <rect x="24" y="194.70000000000002" width="264.25" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="156.125" y="221.60000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="156.125" dy="-3.9000000000000012">共通する力量</tspan><tspan x="156.125" dy="16.900000000000002">基準群と他の社員で保有率を比較</tspan></text>
</g>
<g class="node" data-id="E" data-label="似ている社員
力量の組み合わせから類似度を算出" data-shape="rectangle">
  <rect x="312.25" y="194.70000000000002" width="279.06999999999994" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="451.78499999999997" y="221.60000000000002" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="451.78499999999997" dy="-3.9000000000000012">似ている社員</tspan><tspan x="451.78499999999997" dy="16.900000000000002">力量の組み合わせから類似度を算出</tspan></text>
</g>
<g class="node" data-id="F" data-label="結果をCSVと説明文に保存
教育担当者が確認する材料に" data-shape="rectangle">
  <rect x="186.65" y="288.5" width="234.60999999999999" height="53.800000000000004" rx="0" ry="0" fill="var(--_node-fill)" stroke="var(--_node-stroke)" stroke-width="0.75" />
  <text x="303.955" y="315.4" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)"><tspan x="303.955" dy="-3.9000000000000012">結果をCSVと説明文に保存</tspan><tspan x="303.955" dy="16.900000000000002">教育担当者が確認する材料に</tspan></text>
</g>
</svg>