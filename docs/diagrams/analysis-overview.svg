  <text x="303.955" y="136.25" text-anchor="middle" font-size="13" font-weight="500" fill="var(--_text)" dy="4.55">社員ごとの力量の組み合わせを比較</text>
</g>
<g class="node" data-id="B" data-label="比較の基準にする社員を指定
