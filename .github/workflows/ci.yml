name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.4"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check talent_graph tests/test_data.py tests/test_graph_analysis.py tests/test_cli.py
      - run: uv run --locked pytest -q
      - run: uv run --locked talent-graph demo --output /tmp/talent-demo
      - run: uv run --locked talent-graph validate --data-dir /tmp/talent-demo
      - run: uv run --locked talent-graph analyze --data-dir /tmp/talent-demo --reference-file /tmp/talent-demo/reference.csv --output /tmp/talent-results --epochs 10
