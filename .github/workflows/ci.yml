name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "numpy>=1.24,<2" \
            "pandas>=2,<3" \
            "scipy>=1.11,<2" \
            "statsmodels>=0.14,<0.15" \
            "scikit-learn>=1.3,<2" \
            "pytest>=7.4,<8" \
            "pytest-cov>=4.1,<5"

      - name: Run tests
        run: pytest -q
